name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        run: pytest -q
      - name: Validate Control Center JavaScript
        run: node --check app/control_center_static/app.js
      - name: Build backend image
        run: docker build -t kurv-backend:ci .
      - name: Smoke Control Center container
        run: |
          docker run -d --name kurv-control-center-ci -p 18092:8092 \
            kurv-backend:ci \
            uvicorn app.control_center:app --host 0.0.0.0 --port 8092
          READY=0
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18092/api/health >/tmp/kurv-control-health.json; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker logs kurv-control-center-ci || true
            docker rm -f kurv-control-center-ci || true
            echo "Control Center did not become healthy"
            false
          fi
          curl -fsS http://127.0.0.1:18092/api/snapshot >/tmp/kurv-control-snapshot.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/kurv-control-snapshot.json').read_text())
          assert payload['overall']['components'] >= 30
          assert 'components' in payload and 'dataflow' in payload
          assert 'luna' in payload and 'flyers' in payload and 'data' in payload
          assert payload['release']['control_center'] == '1.0.1'
          print('CONTROL_CENTER_SMOKE_OK')
          PY
          docker rm -f kurv-control-center-ci
      - name: Build Samsung login broker image
        run: docker build -f Dockerfile.login-broker -t kurv-samsung-login:ci .

  ios-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app and test target
        run: |
          set -o pipefail
          xcodebuild \
            -project BaggerShopping.xcodeproj \
            -scheme BaggerShopping \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
