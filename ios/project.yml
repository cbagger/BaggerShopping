name: BaggerShopping
options:
  bundleIdPrefix: dk.chewbagger
targets:
  BaggerShopping:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BaggerShopping
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.chewbagger.BaggerShopping
        PRODUCT_NAME: Kurv
        SWIFT_VERSION: 5.0
        INFOPLIST_FILE: BaggerShopping/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_ENTITLEMENTS: BaggerShopping/BaggerShopping.entitlements
    capabilities:
      location:
        modes:
          - location

  BaggerShoppingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BaggerShoppingTests
    dependencies:
      - target: BaggerShopping
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.chewbagger.BaggerShoppingTests
        SWIFT_VERSION: 5.0
