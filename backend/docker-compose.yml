services:
  bagger-shopping:
    build: .
    container_name: bagger-shopping
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BROWSER_USER_DATA_DIR: /data/chromium-profile/.config/chromium
    ports:
      - "8088:8080"
    volumes:
      - ./data:/data
    shm_size: "1gb"

  mobile-api:
    build: .
    container_name: bagger-shopping-mobile
    restart: unless-stopped
    env_file:
      - .env
    command:
      - uvicorn
      - app.mobile_main:app
      - --host
      - 0.0.0.0
      - --port
      - "8081"
    depends_on:
      - bagger-shopping
    ports:
      - "8089:8081"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          r=urllib.request.Request('http://127.0.0.1:8081/api/mobile/v1/offers/health',headers={'Authorization':'Bearer '+os.environ['MOBILE_API_TOKEN']});
          assert urllib.request.urlopen(r,timeout=30).status == 200
      interval: 30m
      timeout: 40s
      retries: 2
      start_period: 30s
    shm_size: "256mb"

  flyer-push-worker:
    build: .
    container_name: bagger-shopping-flyer-push
    restart: unless-stopped
    env_file:
      - .env
    command:
      - python
      - -m
      - app.flyer_push_quality
    volumes:
      - ./data:/data
      - ./secrets:/run/secrets:ro
    shm_size: "256mb"

  shopping-cleanup-worker:
    build: .
    container_name: bagger-shopping-cleanup
    restart: unless-stopped
    env_file:
      - .env
    command:
      - python
      - -m
      - app.shopping_cleanup
    volumes:
      - ./data:/data
    shm_size: "256mb"

  luna-enrichment-worker:
    build: .
    container_name: bagger-shopping-luna
    restart: unless-stopped
    env_file:
      - .env
    command:
      - python
      - -m
      - app.luna_resilient_strong_worker
    volumes:
      - ./data:/data
    shm_size: "256mb"

  samsung-login-broker:
    build:
      context: .
      dockerfile: Dockerfile.login-broker
    container_name: bagger-shopping-samsung-login
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MOBILE_API_INTERNAL_BASE: http://mobile-api:8081
    depends_on:
      - mobile-api
    ports:
      - "8091:8090"
    volumes:
      - ./data:/data
    shm_size: "1gb"
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          assert urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=5).status == 200
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  login-ui:
    image: lscr.io/linuxserver/chromium:latest
    container_name: bagger-shopping-login-ui
    restart: "no"
    profiles:
      - login
    security_opt:
      - seccomp=unconfined
    environment:
      - PUID=${LOGIN_UI_PUID:-1000}
      - PGID=${LOGIN_UI_PGID:-1000}
      - TZ=${TZ:-Europe/Copenhagen}
      - CUSTOM_USER=${LOGIN_UI_USER:-bagger}
      - PASSWORD=${LOGIN_UI_PASSWORD}
      - CHROME_CLI=https://app.samsungfood.com
      - PIXELFLUX_WAYLAND=false
      - TITLE=Bagger Shopping Samsung Login
    volumes:
      - ./data/chromium-profile:/config
    ports:
      - "3001:3001"
    shm_size: "1gb"
